
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-rest-api-fabric-ingestion"
version = "0.3.0"
description = "Reusable REST API ingestion framework with Microsoft Fabric integration"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "pyarrow>=17,<25",
    "tzdata>=2025.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]